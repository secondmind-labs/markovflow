name: Tests

on:
  push:
  pull_request:
    branches:
      - develop

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install library
        run: poetry install --no-interaction

      - name: Install banded_matrices compatibility branch
        run: |
          git clone --depth 1 --branch update-python-compat https://github.com/secondmind-labs/banded_matrices.git /tmp/banded_matrices
          pushd /tmp/banded_matrices
          poetry build -f wheel
          popd
          poetry run python -m pip install --no-deps --force-reinstall /tmp/banded_matrices/dist/*.whl

      - name: Run tests
        run: poetry run task quicktest

      - name: Run notebook smoke tests
        run: poetry run task notebooktest
