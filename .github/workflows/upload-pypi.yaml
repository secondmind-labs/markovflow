name: Upload PyPI Package

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install banded_matrices compatibility branch
        run: poetry run python -m pip install --force-reinstall "git+https://github.com/secondmind-labs/banded_matrices.git@update-python-compat"

      - name: Run tests
        run: poetry run task quicktest

      - name: Run notebook smoke tests
        run: poetry run task notebooktest

  publish:
    needs: test
    runs-on: ubuntu-latest
    name: Publish package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Check package metadata
        run: poetry check

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
