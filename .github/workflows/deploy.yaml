name: Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    name: Deploy documentation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install banded_matrices compatibility branch
        run: poetry run python -m pip install --force-reinstall "git+https://github.com/secondmind-labs/banded_matrices.git@update-python-compat"

      - name: Build documentation
        run: poetry run make docs

      - name: Prepare documentation branch
        run: |
          TMP_DIR=$(mktemp -d -p "$(pwd)")
          mv docs/_build/html/* "$TMP_DIR"
          rm -rf docs
          mv "$TMP_DIR" docs
          touch docs/.nojekyll

      - name: Push documentation
        run: |
          git add docs
          git config --global user.email "none"
          git config --global user.name "github-actions-bot"
          git commit -m "build documentation"
          git push -f origin HEAD:gh-pages
