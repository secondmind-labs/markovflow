name: Build and Upload Markovflow TestPyPI Package

on:
  workflow_dispatch:
  push:
    branches:
      - update-python-compat

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-14
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install banded_matrices compatibility branch
        run: |
          git clone --depth 1 --branch update-python-compat https://github.com/secondmind-labs/banded_matrices.git /tmp/banded_matrices
          PYTHON_BIN="$(poetry run python -c 'import sys; print(sys.executable)')"
          CMAKE_BIN="$(poetry run python -c 'import shutil; print(shutil.which("cmake"))')"
          PACKAGE_DIR="$(poetry run python -c 'import importlib.util; spec = importlib.util.find_spec("banded_matrices"); print(spec.submodule_search_locations[0])')"
          mkdir -p "${PACKAGE_DIR}/lib" /tmp/banded_matrices/build-ci
          pushd /tmp/banded_matrices/build-ci
          "${CMAKE_BIN}" ../banded_matrices -Wno-dev -DPYTHON_BIN="${PYTHON_BIN}" -DCMAKE_BUILD_TYPE=release -DCMAKE_CXX_COMPILER=g++ -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="${PACKAGE_DIR}/lib" -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${PACKAGE_DIR}/bin" -DCMAKE_VERBOSE_MAKEFILE:BOOL=on -DCMAKE_CXX_STANDARD=17
          "${CMAKE_BIN}" --build .
          popd
          poetry run python -c "from banded_matrices.library import banded_ops; print(banded_ops)"

      - name: Run tests
        run: poetry run task quicktest

      - name: Run notebook smoke tests
        run: poetry run task notebooktest

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.3.4
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Check package metadata
        run: poetry check

      - name: Build package
        run: poetry build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: markovflow-dist
          path: dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
